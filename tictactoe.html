<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; }
        .board { width: 300px; border: 2px solid #000; }
        .cell { width: 100px; height: 100px; display: inline-block; text-align: center; line-height: 100px; font-size: 50px; font-weight: bold; background-color: #fff; border: 2px solid #000; }
        .winner { color: red; font-size: 30px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Tic Tac Toe Game</h1>
    <div class="board" id="board">
        <div class="cell" onclick="handleClick(0)"></div>
        <div class="cell" onclick="handleClick(1)"></div>
        <div class="cell" onclick="handleClick(2)"></div>
        <div class="cell" onclick="handleClick(3)"></div>
        <div class="cell" onclick="handleClick(4)"></div>
        <div class="cell" onclick="handleClick(5)"></div>
        <div class="cell" onclick="handleClick(6)"></div>
        <div class="cell" onclick="handleClick(7)"></div>
        <div class="cell" onclick="handleClick(8)"></div>
    </div>
    <p id="winner" class="winner"></p>

    <script>
        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let winner = null;

        function handleClick(index) {
            if (!board[index] && !winner) {
                board[index] = currentPlayer;
                document.querySelector(`.cell:nth-child(${index + 1})`).textContent = currentPlayer;
                checkWin();
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        }

        function checkWin() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];

            for (let combination of winningCombinations) {
                if (board[combination[0]] && board[combination[0]] === board[combination[1]] && board[combination[1]] === board[combination[2]]) {
                    winner = currentPlayer;
                    document.getElementById('winner').textContent = `Player ${currentPlayer} wins!`;
                    return true;
                }
            }

            if (!board.includes('')) {
                document.getElementById('winner').textContent = 'Draw game.';
                return true;
            }

            return false;
        }
    </script>
</body>
</html>
