# llama-swap: one OpenAI-compatible endpoint, many models, loaded on demand.
# Start:  llama-swap --config ~/.config/llama-swap/config.yaml --listen 127.0.0.1:8080
# UI:     http://127.0.0.1:8080/ui

healthCheckTimeout: 600
logLevel: info

macros:
  server: "/opt/homebrew/bin/llama-server --host 127.0.0.1 --port ${PORT} --jinja -fa on -ngl 99 --no-webui -ctk q8_0 -ctv q8_0 -np 1 --spec-type ngram-map-k4v"
  lmsdir: "/Users/ken/.lmstudio/models"
  hfdir: "/Users/ken/models"

models:
  # --- already on disk ---
  "qwen3.8-27b":
    name: "Qwen3.8 27B (local)"
    cmd: |
      ${server}
      -m ${lmsdir}/lmstudio-community/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf
      -c 262144
      --chat-template-kwargs '{"reasoning_effort":"xhigh"}'
    ttl: 600

  "gemma-4-e4b":
    name: "Gemma 4 E4B (local)"
    cmd: |
      ${server}
      -m ${lmsdir}/lmstudio-community/gemma-4-E4B-it-GGUF/gemma-4-E4B-it-Q4_K_M.gguf
      -c 16384
    ttl: 600

  "qwen3-4b":
    name: "Qwen3 4B Instruct (local)"
    env:
      - "LLAMA_CACHE=${hfdir}"
    cmd: |
      ${server}
      -hf unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      -c 32768
    ttl: 300

  # --- MLX runtime (Apple Neural Accelerators via MLX) ---
  # Benchmarked on M5 Pro vs llama.cpp on the identical model+quant:
  #   MLX      pp2048 463.8 t/s | tg 16.81 t/s
  #   llama.cpp pp2048 386.1 t/s | tg 15.47 t/s
  "qwen3.8-27b-mlx":
    name: "Qwen3.8 27B MLX (local, fastest)"
    # mlx_lm.server loads whatever repo id the request names, ignoring --model.
    # Without this it tries to fetch "qwen3.8-27b-mlx" from HuggingFace and 404s.
    useModelName: "mlx-community/Qwen3.8-27B-4bit"
    env:
      - "HF_HOME=/Users/ken/models/hf"
    cmd: |
      /Users/ken/.local/bin/mlx_lm.server
      --model mlx-community/Qwen3.8-27B-4bit
      --host 127.0.0.1 --port ${PORT}
    ttl: 900

  # --- embeddings for the second brain semantic index ---
  # Model id must stay "second-brain-embed" and the revision must stay
  # nomic-embed-text-v1.5-q4_k_m: brainlib/memory.py stores vectors under
  # "<model>@<revision>", so changing either invalidates every stored vector.
  "second-brain-embed":
    name: "Second Brain embeddings (nomic-embed-text-v1.5)"
    env:
      - "LLAMA_CACHE=/Users/ken/models"
    cmd: |
      /opt/homebrew/bin/llama-server --host 127.0.0.1 --port ${PORT} --no-webui
      -hf nomic-ai/nomic-embed-text-v1.5-GGUF:Q4_K_M
      --embeddings --pooling mean -c 8192 -ngl 99 -b 8192 -ub 8192
    ttl: 1800
